services:
  client-service:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "5000:5000"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=zta
      - KEYCLOAK_CLIENT_ID=pep-backend
      - KEYCLOAK_CLIENT_SECRET=DXtmD2csJMM21EcTbOXWoFqNRF5yvGS2
      - PEP_SERVICE_URL=http://pep-service:5001
    networks:
      - keycloak-network

  pep-service:
    build:
      context: .
      dockerfile: Dockerfile.pep
    ports:
      - "5001:5001"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=zta
      - KEYCLOAK_CLIENT_ID=pep-backend
      - KEYCLOAK_CLIENT_SECRET=ifTLdQIpnHOscFeMpiY5jiiO58RvjYxu
      - PDP_SERVICE_URL=http://pdp-service:5002
    networks:
      - keycloak-network
    depends_on:
      - pdp-service

  pdp-service:
    build:
      context: .
      dockerfile: Dockerfile.pdp
    ports:
      - "5002:5002"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=zta
      - KEYCLOAK_CLIENT_ID=pep-backend
      - KEYCLOAK_CLIENT_SECRET=ifTLdQIpnHOscFeMpiY5jiiO58RvjYxu
    networks:
      - keycloak-network

networks:
  keycloak-network:
    external: true
    name: keycloak-docker