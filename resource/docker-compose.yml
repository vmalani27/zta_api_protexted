version: '3.8'

services:
  protected-resource:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-here
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    networks:
      - protected-network

networks:
  protected-network:
    external: true
    name: protected_resource_protected-network