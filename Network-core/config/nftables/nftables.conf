!/usr/sbin/nft -fflush rulesettable inet filter {    chain input {        type filter hook input priority 0;        ct state established,related accept        iifname lo accept        udp dport { 1812, 1813 } accept        drop    }    chain forward {        type filter hook forward priority 0;        drop    }    chain output {        type filter hook output priority 0;        accept    }}table ip nat {    chain prerouting {        type nat hook prerouting priority 0;    }    chain postrouting {        type nat hook postrouting priority 100;                # NAT for ZT network        oifname eth0 masquerade    }}# Chain for managing device stateschain device_state {    # Add device to blacklist    add @blacklist { ip saddr } timeout 1h accept        # Remove device from blacklist    delete @blacklist { ip saddr } accept        # Add device to rate limit    add @rate_limit { ip saddr } timeout 60s accept} 