prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/freeradius
raddbdir = /etc/freeradius/3.0
radacctdir = ${logdir}/radacct

# Logging
log {
    destination = files
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = yes
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
}

# Authentication
authorize {
    files
    pap
}

# Authentication methods
authenticate {
    Auth-Type PAP {
        pap
    }
}

# Accounting
accounting {
    detail
    unix
}

# Session management
session {
    radutmp
}

# Client configuration
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nastype = other
} 