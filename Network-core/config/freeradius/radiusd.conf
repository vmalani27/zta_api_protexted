prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/freeradius
raddbdir = /etc/freeradius/3.0
radacctdir = ${logdir}/radacct

# Security settings
security {
    max_attributes = 200
    reject_delay = 1
    status_server = yes
    allow_core_dumps = no
    hostname_lookups = no
    allow_vulnerable_openssl = no
}

# Logging
log {
    destination = files
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = yes
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
    timestamp = yes
    # Rotate logs
    rotate {
        daily
        missingok
        notifempty
        compress
        delaycompress
        create 0640 freerad freerad
    }
}

# Authentication
authorize {
    # Check for valid client
    if (!Client-IP-Address) {
        reject
    }
    
    # Rate limiting
    if (Client-IP-Address) {
        update control {
            &Auth-Type := PAP
        }
    }
    
    # Future-proofing: Prepare for EAP
    if (EAP-Message) {
        update control {
            &Auth-Type := EAP
        }
    }
    
    files
    pap
}

# Authentication methods
authenticate {
    Auth-Type PAP {
        pap
    }
    
    # Future-proofing: EAP support
    Auth-Type EAP {
        eap
    }
}

# Accounting
accounting {
    detail
    unix
    exec
}

# Session management
session {
    radutmp
}

# Client configuration
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nastype = other
}

client zt_network {
    ipaddr = 192.168.200.22/32
    secret = zt_secret
    require_message_authenticator = yes
    nastype = other
    # Future-proofing: EAP support
    eap = yes
} 