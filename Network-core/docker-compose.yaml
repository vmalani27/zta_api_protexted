version: "3.8"

services:
  network-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-core
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      zt_network:
        ipv4_address: 192.168.200.2
      intranet:
        ipv4_address: 192.168.100.2
    volumes:
      - ./config/nftables:/etc/nftables:ro
      - ./config/freeradius:/etc/freeradius/3.0:ro
      - ./logs/freeradius:/var/log/freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    restart: unless-stopped

networks:
  zt_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
          gateway: 192.168.200.1
  intranet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
