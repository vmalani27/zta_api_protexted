version: '3.8'

services:
  client-service:
    build:
      context: .
      dockerfile: Dockerfile.client
    network_mode: host
    environment:
      - KEYCLOAK_HOST=192.168.31.169
      - KEYCLOAK_PORT=8080
      - REALM=zta
      - CLIENT_ID=pep-backend
      - CLIENT_SECRET=d52pE1IzTDw1f94AnuuH59Hudkw37Hp7
      - PDP_HOST=127.0.0.1
      - PDP_PORT=5002
      - PEP_HOST=127.0.0.1
      - PEP_PORT=5003
      - RESOURCE_HOST=127.0.0.1
      - RESOURCE_PORT=8001

  pep-service:
    build:
      context: .
      dockerfile: Dockerfile.pep
    network_mode: host
    environment:
      - KEYCLOAK_HOST=192.168.31.169
      - KEYCLOAK_PORT=8080
      - REALM=zta
      - CLIENT_ID=pep-backend
      - RESOURCE_HOST=127.0.0.1
      - RESOURCE_PORT=8001
    depends_on:
      - pdp-service

  pdp-service:
    build:
      context: .
      dockerfile: Dockerfile.pdp
    network_mode: host
    environment:
      - KEYCLOAK_HOST=192.168.31.169
      - KEYCLOAK_PORT=8080
      - REALM=zta
      - CLIENT_ID=pep-backend
      - PEP_HOST=127.0.0.1
      - PEP_PORT=5003

  portknock:
    build:
      context: .
      dockerfile: Dockerfile.portknock
    ports:
      - "7000:7000"
      - "8000:8000"
      - "9000:9000"
    environment:
      - KNOCK_SEQUENCE=7000,8000,9000
      - KNOCK_TIMEOUT=10
      - PORT_OPEN_DURATION=30
      - PROTECTED_PORTS=5001,5002,5003,8001

  protected-resource:
    build:
      context: .
      dockerfile: Dockerfile.resource
    network_mode: host
    environment:
      - SECRET_KEY=your-secret-key-here
